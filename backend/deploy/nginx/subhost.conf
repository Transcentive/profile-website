# Subhosted mini-app: a dedicated subdomain reverse-proxied to an independent
# service (any language/stack) running on its own local port. One file per app;
# generate with scripts/new_subhost.py.
#
# Placeholders:
#   SUBDOMAIN  e.g. brewery.tomsherlock.space
#   UPSTREAM   e.g. 127.0.0.1:9001
#
# After installing, obtain TLS with: certbot --nginx -d SUBDOMAIN

server {
    listen 80;
    listen [::]:80;
    server_name SUBDOMAIN;

    location / {
        proxy_pass http://UPSTREAM;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE upgrade support (Flutter web, live demos, etc.).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
